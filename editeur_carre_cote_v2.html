<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Carré Côté — Éditeur</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#eee;color:#222}
button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100vh;display:flex;flex-direction:column}
header{height:58px;flex:none;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20}.logo{font-weight:700;white-space:nowrap}.spacer{flex:1}
.btn{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 12px}.primary{background:#222;color:#fff;border-color:#222}.danger{color:#b42318}
.main{flex:1;min-height:0;display:flex}.sidebar{width:340px;flex:none;background:#fff;border-right:1px solid #ddd;overflow:auto;padding:15px}.editor{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:52px;flex:none;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:7px;align-items:center;padding:7px 10px}.levels{display:flex;gap:6px;overflow:auto;flex:1}.level-btn{border:1px solid #ccc;background:#fff;border-radius:7px;padding:8px 12px;white-space:nowrap}.level-btn.active{background:#222;color:#fff}
.viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:#e8e8e8;touch-action:none;cursor:grab}.viewer.dragging{cursor:grabbing}.plan-layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.plan{display:block;width:auto;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot-layer{position:fixed;inset:0;z-index:10;pointer-events:none}.hotspot{position:absolute;width:24px;height:24px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;box-shadow:0 2px 7px #0005}.hotspot.selected{outline:3px solid #fff;box-shadow:0 0 0 3px #222,0 2px 8px #0005}.hotspot:before{content:"";position:absolute;width:52px;height:52px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
@media(hover:hover){.hotspot:hover{transform:translate(-50%,-50%) scale(1.25)}}
.section{border-top:1px solid #e5e5e5;margin-top:14px;padding-top:14px}.title{font-size:18px;font-weight:700;margin:0 0 12px}label{display:block;font-size:12px;font-weight:700;color:#555;margin:0 0 5px}input[type=text],textarea{width:100%;border:1px solid #ccc;border-radius:7px;padding:9px;background:#fff}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:7px}.row>*{flex:1}
.room-list{display:flex;flex-direction:column;gap:5px;margin-top:9px}.room-item{display:flex;align-items:center;gap:7px;border:1px solid #ddd;border-radius:7px;padding:7px}.dot{width:16px;height:16px;border-radius:50%;border:1px solid #aaa}.room-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon{border:0;background:transparent;font-size:17px;padding:3px}.card{border:1px solid #ddd;border-radius:8px;padding:9px;margin-top:9px;background:#fafafa}.cardhead{display:flex;align-items:center;gap:5px}.cardhead strong{flex:1}.small{font-size:12px;color:#777;margin-top:6px}.notice{font-size:12px;color:#666;background:#f6f6f6;border-radius:8px;padding:9px;margin-top:10px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#777;padding:30px;pointer-events:none}
.info-box{display:none;position:fixed;z-index:40;width:min(650px,90vw);max-height:85vh;left:50%;top:50%;transform:translate(-50%,-50%);padding:30px;background:#fff;border-radius:14px;box-shadow:0 10px 40px #0005;overflow:auto}.info-box h2{margin-top:0}.info-box p{line-height:1.5}.close{position:absolute;right:10px;top:7px;width:36px;height:36px;line-height:36px;text-align:center;font-size:28px;cursor:pointer}
.modalback{display:none;position:fixed;inset:0;background:#0007;z-index:60;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:12px;padding:20px;width:min(500px,100%)}.modal h2{margin-top:0}
.preview .sidebar,.preview .toolbar{display:none}
.preview .editor{height:100%}
.preview .preview-bar{display:flex}
.preview .hotspot{cursor:pointer}
.preview .hotspot.dragging{cursor:pointer}
.preview-bar{display:none;position:fixed;left:0;right:0;top:0;height:58px;background:#fff;border-bottom:1px solid #ddd;z-index:2000;align-items:center;gap:8px;padding:0 12px}
.preview-levels{display:flex;gap:6px;overflow-x:auto;flex:1}
.preview-levels .level-btn{white-space:nowrap}
@media(max-width:800px){.sidebar{position:absolute;z-index:25;top:58px;bottom:0;left:0;width:min(340px,90vw);box-shadow:8px 0 30px #0003}.logo{font-size:15px}.spacer{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="logo">Carré Côté — Éditeur</div><div class="spacer"></div><button class="btn" id="newBtn">Nouveau</button><button class="btn" id="importBtn">Importer</button><button class="btn" id="exportBtn">Exporter</button><button class="btn primary" id="previewBtn">👁 Aperçu</button><input id="importFile" type="file" accept=".json" hidden></header>
<div class="preview-bar" id="previewBar"><div class="preview-levels" id="previewLevels"></div><button class="btn primary" id="backEditor">✎ Éditeur</button></div>
<div class="main">
<aside class="sidebar" id="sidebar">
<h2 class="title">Projet</h2><label>Nom du projet</label><input type="text" id="projectName" placeholder="Ex. Villa AYREM">
<div class="section"><div class="row"><button class="btn primary" id="addLevel">+ Ajouter un étage</button><button class="btn" id="delLevel">Supprimer</button></div></div>
<div class="section" id="levelPanel" style="display:none"><label>Nom de l'étage</label><input type="text" id="levelName"><label style="margin-top:10px">Plan de l'étage</label><input type="file" id="planFile" accept="image/*"><div class="small">PNG recommandé pour conserver la meilleure qualité.</div></div>
<div class="section" id="roomsPanel" style="display:none"><div class="row"><strong style="padding-top:9px">Pièces</strong><button class="btn" id="addRoom">+ Pièce</button></div><div class="room-list" id="roomList"></div></div>
<div class="section" id="roomPanel" style="display:none"><div class="row"><div><label>Nom</label><input type="text" id="roomName"></div><div style="flex:0 0 52px"><label>Couleur</label><input id="roomColor" type="color" value="#6f42c1" style="width:44px;height:38px;padding:2px"></div></div><div class="row" style="margin-top:8px"><button class="btn primary" id="addSection">+ Rubrique</button><button class="btn danger" id="delRoom">Supprimer</button></div><div id="sections"></div><div class="notice">Tu peux déplacer une pastille directement sur le plan. Chaque fiche peut avoir ses propres rubriques.</div></div>
</aside>
<section class="editor"><div class="toolbar"><div class="levels" id="levels"></div><button class="btn" id="fit">↔ Ajuster</button><button class="btn" id="addRoom2">+ Pièce</button><button class="btn" id="sideBtn">☰</button></div><div class="viewer" id="viewer"><div class="plan-layer" id="planLayer"></div><div class="hotspot-layer" id="hotspotLayer"></div><div class="empty" id="empty">Crée un étage puis charge son plan.</div></div></section>
</div></div>
<div class="info-box" id="infoBox"><span class="close" id="infoClose">×</span><div id="infoContent"></div></div>
<div class="modalback" id="modal"><div class="modal"><h2>Nouveau projet</h2><label>Nom du projet</label><input type="text" id="newName" placeholder="Ex. Villa DUPONT"><div style="margin-top:15px;text-align:right"><button class="btn" id="cancel">Annuler</button> <button class="btn primary" id="create">Créer</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
let data={version:1,projectName:"Nouveau projet",levels:[]},currentLevel=null,currentRoom=null;
let image=null,imageWidth=0,imageHeight=0,scale=1,offsetX=0,offsetY=0,hotspots={};
const MIN_SCALE=.05,MAX_SCALE=8;

const projectName=$("projectName"),levels=$("levels"),levelPanel=$("levelPanel"),levelName=$("levelName"),roomsPanel=$("roomsPanel"),roomPanel=$("roomPanel"),roomList=$("roomList"),roomName=$("roomName"),roomColor=$("roomColor"),sections=$("sections"),viewer=$("viewer"),planLayer=$("planLayer"),hotspotLayer=$("hotspotLayer"),empty=$("empty"),infoBox=$("infoBox"),infoContent=$("infoContent");

const uid=p=>p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
const getLevel=()=>data.levels.find(x=>x.id===currentLevel);
const getRoom=()=>getLevel()?.rooms.find(x=>x.id===currentRoom);
const save=()=>{try{localStorage.setItem("cc_editor_project",JSON.stringify(data))}catch(e){}};

projectName.oninput=()=>{data.projectName=projectName.value;save()};

function render(){
 projectName.value=data.projectName||"";levels.innerHTML="";
 data.levels.forEach(l=>{let b=document.createElement("button");b.className="level-btn"+(l.id===currentLevel?" active":"");b.textContent=l.name;b.onclick=()=>selectLevel(l.id);levels.appendChild(b)});
 renderLevel();save();
}
function selectLevel(id){currentLevel=id;currentRoom=null;render()}
function renderLevel(){
 const l=getLevel();levelPanel.style.display=l?"block":"none";roomsPanel.style.display=l?"block":"none";roomPanel.style.display=currentRoom?"block":"none";
 roomList.innerHTML="";sections.innerHTML="";hotspotLayer.innerHTML="";planLayer.innerHTML="";hotspots={};image=null;empty.style.display=l?"none":"flex";
 if(!l)return;
 levelName.value=l.name;l.rooms.forEach(addHotspot);
 l.rooms.forEach(r=>{let item=document.createElement("div");item.className="room-item";item.innerHTML='<span class="dot"></span><span class="room-name"></span><button class="icon">✎</button>';item.querySelector(".dot").style.background=r.color;item.querySelector(".room-name").textContent=r.name;item.onclick=e=>{if(e.target.tagName!=="BUTTON")selectRoom(r.id)};item.querySelector("button").onclick=e=>{e.stopPropagation();selectRoom(r.id)};roomList.appendChild(item)});
 if(currentRoom)fillRoom();loadPlan();
}
function addHotspot(r){
 let h=document.createElement("div");
 h.className="hotspot";
 h.dataset.id=r.id;
 h.title=r.name;
 h.style.background=r.color;
 h.onclick=e=>{
   e.stopPropagation();
   if(h.dataset.dragged==="1"){h.dataset.dragged="0";return}
   selectRoom(r.id);
   showInfo(r.id);
 };
 hotspotLayer.appendChild(h);
 hotspots[r.id]=h;
}
function selectRoom(id){currentRoom=id;roomPanel.style.display="block";fillRoom();Object.values(hotspots).forEach(h=>h.classList.remove("selected"));hotspots[id]?.classList.add("selected")}
function fillRoom(){let r=getRoom();if(!r)return;roomName.value=r.name;roomColor.value=r.color;renderSections()}
function renderSections(){sections.innerHTML="";let r=getRoom();if(!r)return;r.sections.forEach((s,i)=>{let c=document.createElement("div");c.className="card";c.innerHTML='<div class="cardhead"><strong></strong><button class="icon">↑</button><button class="icon">↓</button><button class="icon">×</button></div><label>Titre</label><input type="text" class="st"><label style="margin-top:7px">Contenu</label><textarea class="sb"></textarea>';c.querySelector("strong").textContent="Rubrique "+(i+1);c.querySelector(".st").value=s.title||"";c.querySelector(".sb").value=s.body||"";c.querySelector(".st").oninput=e=>{s.title=e.target.value;save()};c.querySelector(".sb").oninput=e=>{s.body=e.target.value;save()};let b=c.querySelectorAll("button");b[0].onclick=()=>moveSection(i,-1);b[1].onclick=()=>moveSection(i,1);b[2].onclick=()=>{r.sections.splice(i,1);renderSections();save()};sections.appendChild(c)})}
function moveSection(i,d){let r=getRoom(),j=i+d;if(!r||j<0||j>=r.sections.length)return;[r.sections[i],r.sections[j]]=[r.sections[j],r.sections[i]];renderSections();save()}
$("addSection").onclick=()=>{let r=getRoom();if(!r)return;r.sections.push({title:"Nouvelle rubrique",body:""});renderSections();save()};
function addRoom(x=50,y=50){let l=getLevel();if(!l){alert("Crée d'abord un étage.");return}let r={id:uid("room"),name:"Nouvelle pièce",x,y,color:"#6f42c1",sections:[]};l.rooms.push(r);currentRoom=r.id;renderLevel();selectRoom(r.id);save()}
$("addRoom").onclick=()=>addRoom();$("addRoom2").onclick=()=>addRoom();
roomName.oninput=()=>{let r=getRoom();if(!r)return;r.name=roomName.value;if(hotspots[r.id])hotspots[r.id].title=r.name;renderRoomList();save()};
roomColor.oninput=()=>{let r=getRoom();if(!r)return;r.color=roomColor.value;if(hotspots[r.id])hotspots[r.id].style.background=r.color;renderRoomList();save()};
function renderRoomList(){let l=getLevel();if(!l)return;[...roomList.children].forEach((el,i)=>{el.querySelector(".room-name").textContent=l.rooms[i].name;el.querySelector(".dot").style.background=l.rooms[i].color})}
$("delRoom").onclick=()=>{let l=getLevel();if(!l||!currentRoom)return;if(!confirm("Supprimer cette pièce ?"))return;l.rooms=l.rooms.filter(r=>r.id!==currentRoom);currentRoom=null;render()};
$("addLevel").onclick=()=>{let l={id:uid("level"),name:"Nouvel étage",plan:null,rooms:[]};data.levels.push(l);currentLevel=l.id;render()};
$("delLevel").onclick=()=>{if(!currentLevel)return;if(!confirm("Supprimer cet étage et ses pièces ?"))return;data.levels=data.levels.filter(l=>l.id!==currentLevel);currentLevel=data.levels[0]?.id||null;currentRoom=null;render()};
levelName.oninput=()=>{let l=getLevel();if(l){l.name=levelName.value;save();renderLevelsOnly()}};
function renderLevelsOnly(){[...levels.children].forEach((b,i)=>b.textContent=data.levels[i].name)}
$("planFile").onchange=()=>{let f=$("planFile").files[0],l=getLevel();if(!f||!l)return;let rd=new FileReader();rd.onload=()=>{l.plan={name:f.name,dataUrl:rd.result};save();loadPlan()};rd.readAsDataURL(f)};

function loadPlan(){let l=getLevel();if(!l?.plan){empty.style.display="flex";return}let im=new Image();im.onload=()=>{image=im;imageWidth=im.naturalWidth;imageHeight=im.naturalHeight;planLayer.innerHTML="";im.className="plan";planLayer.appendChild(im);fit()};im.src=l.plan.dataUrl}
function fit(){if(!image)return;let vw=viewer.clientWidth,vh=viewer.clientHeight;scale=Math.min(vw/imageWidth,vh/imageHeight);offsetX=(vw-imageWidth*scale)/2;offsetY=(vh-imageHeight*scale)/2;update()}
function update(){planLayer.style.transform=`translate3d(${offsetX}px,${offsetY}px,0) scale(${scale})`;updateHotspots()}
function updateHotspots(){let l=getLevel();if(!l||!image)return;l.rooms.forEach(r=>{let h=hotspots[r.id];if(h){h.style.left=(offsetX+imageWidth*r.x/100*scale)+"px";h.style.top=(offsetY+imageHeight*r.y/100*scale)+"px"}})}
function zoomAt(x,y,s){let ix=(x-offsetX)/scale,iy=(y-offsetY)/scale;s=Math.max(MIN_SCALE,Math.min(MAX_SCALE,s));offsetX=x-ix*s;offsetY=y-iy*s;scale=s;update()}
$("fit").onclick=fit;

let md=false,mx=0,my=0,ox=0,oy=0;
viewer.onmousedown=e=>{if(e.button!==0||e.target.closest(".hotspot"))return;md=true;mx=e.clientX;my=e.clientY;ox=offsetX;oy=offsetY;viewer.classList.add("dragging")};
window.onmousemove=e=>{if(md){offsetX=ox+e.clientX-mx;offsetY=oy+e.clientY-my;update()}};
window.onmouseup=()=>{md=false;viewer.classList.remove("dragging")};
viewer.addEventListener("wheel",e=>{e.preventDefault();let r=viewer.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,scale*(e.deltaY<0?1.12:1/1.12))},{passive:false});

let tm=null,tsx=0,tsy=0,tox=0,toy=0,pd=0,ps=1,moved=false;
const distance=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
viewer.addEventListener("touchstart",e=>{if(e.touches.length===2){tm="pinch";pd=distance(e.touches[0],e.touches[1]);ps=scale;moved=true}else if(e.touches.length===1){tm="drag";tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;tox=offsetX;toy=offsetY;moved=false}},{passive:true});
viewer.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches.length===2&&tm==="pinch"){let d=distance(e.touches[0],e.touches[1]),r=viewer.getBoundingClientRect(),cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;zoomAt(cx-r.left,cy-r.top,ps*d/pd)}else if(e.touches.length===1&&tm==="drag"){let dx=e.touches[0].clientX-tsx,dy=e.touches[0].clientY-tsy;if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;offsetX=tox+dx;offsetY=toy+dy;update()}},{passive:false});
viewer.addEventListener("touchend",e=>{if(e.changedTouches.length===1&&!moved)findHotspotAt(e.changedTouches[0].clientX,e.changedTouches[0].clientY);if(!e.touches.length)tm=null});
function findHotspotAt(x,y){let l=getLevel(),best=null,bd=Infinity;if(!l)return;l.rooms.forEach(r=>{let hx=offsetX+imageWidth*r.x/100*scale,hy=offsetY+imageHeight*r.y/100*scale,d=Math.hypot(x-hx,y-hy);if(d<30&&d<bd){best=r;bd=d}});if(best){selectRoom(best.id);showInfo(best.id)}}

let draggedHotspot=null;
let draggedRoom=null;
let hotspotMoved=false;

hotspotLayer.addEventListener("pointerdown",e=>{
 let h=e.target.closest(".hotspot");
 if(!h || $("app").classList.contains("preview")) return;
 let r=getRoomById(h.dataset.id);
 if(!r || !image) return;

 e.preventDefault();
 e.stopPropagation();

 currentRoom=r.id;
 selectRoom(r.id);
 draggedHotspot=h;
 draggedRoom=r;
 hotspotMoved=false;

 try{h.setPointerCapture(e.pointerId)}catch(err){}

 const move=ev=>{
   if(!draggedRoom)return;
   const rect=viewer.getBoundingClientRect();
   let nx=(ev.clientX-rect.left-offsetX)/(imageWidth*scale)*100;
   let ny=(ev.clientY-rect.top-offsetY)/(imageHeight*scale)*100;

   nx=Math.max(0,Math.min(100,nx));
   ny=Math.max(0,Math.min(100,ny));

   if(Math.abs(nx-draggedRoom.x)>0.02 || Math.abs(ny-draggedRoom.y)>0.02)
      hotspotMoved=true;

   draggedRoom.x=nx;
   draggedRoom.y=ny;
   updateHotspots();
 };

 const up=ev=>{
   if(draggedHotspot && hotspotMoved) draggedHotspot.dataset.dragged="1";
   try{draggedHotspot?.releasePointerCapture(ev.pointerId)}catch(err){}
   window.removeEventListener("pointermove",move);
   window.removeEventListener("pointerup",up);
   save();
   draggedHotspot=null;
   draggedRoom=null;
 };

 window.addEventListener("pointermove",move);
 window.addEventListener("pointerup",up);
});

function getRoomById(id){return getLevel()?.rooms.find(r=>r.id===id)}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
function showInfo(id){let r=getRoomById(id);if(!r)return;let h="<h2>"+esc(r.name)+"</h2>";r.sections.forEach(s=>{if(s.title||s.body)h+="<h3>"+esc(s.title)+"</h3><p>"+esc(s.body)+"</p>"});if(!r.sections.length)h+="<p>Aucune information renseignée.</p>";infoContent.innerHTML=h;infoBox.style.display="block"}
$("infoClose").onclick=()=>infoBox.style.display="none";

function buildPreviewBar(){
 const pl=$("previewLevels");
 pl.innerHTML="";
 data.levels.forEach(l=>{
   const b=document.createElement("button");
   b.className="btn level-btn"+(l.id===currentLevel?" active":"");
   b.textContent=l.name;
   b.onclick=()=>{currentLevel=l.id;currentRoom=null;render();$("app").classList.add("preview");buildPreviewBar()};
   pl.appendChild(b);
 });
}

function enterPreview(){
 $("app").classList.add("preview");
 infoBox.style.display="none";
 buildPreviewBar();
}

function exitPreview(){
 $("app").classList.remove("preview");
 infoBox.style.display="none";
 render();
}

$("previewBtn").onclick=enterPreview;
$("backEditor").onclick=exitPreview;

document.addEventListener("keydown",e=>{
 if(e.key==="Escape" && $("app").classList.contains("preview")) exitPreview();
});
$("sideBtn").onclick=()=>document.querySelector(".sidebar").classList.toggle("open");

$("newBtn").onclick=()=>{$("modal").style.display="flex";$("newName").value=""};
$("cancel").onclick=()=>$("modal").style.display="none";
$("create").onclick=()=>{data={version:1,projectName:$("newName").value.trim()||"Nouveau projet",levels:[]};currentLevel=null;currentRoom=null;$("modal").style.display="none";render()};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=()=>{let f=$("importFile").files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.levels))throw 0;data=d;currentLevel=data.levels[0]?.id||null;currentRoom=null;render()}catch(e){alert("Fichier projet invalide.")}};rd.readAsText(f)};
$("exportBtn").onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(data.projectName||"projet").replace(/[^\w-]+/g,"-")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.addEventListener("resize",()=>{if(image)update()});
render();
</script>
</body>
</html>
